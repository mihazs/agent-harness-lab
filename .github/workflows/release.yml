name: Version and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          cache: npm
      - uses: arduino/setup-task@v3
        with:
          version: '3.54.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: task setup
      - run: task setup:test
      - name: Run the suite and stop at the first failure
        env:
          PYTEST_ADDOPTS: --maxfail=1
        run: task test
      - name: Require every regression pin to fail on its unfixed parent
        run: task test:pins
      - uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: task version
          publish-script: task release
          create-github-releases: false
          push-git-tags: false
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Changesets publishes only when no changeset is pending; this step releases any
      # version commit it skipped (idempotent: a no-op when every version is released).
      - name: Publish unreleased version commits
        run: |
          # changesets/action leaves `task version` edits in the tracked tree; the publisher refuses a dirty tree.
          git reset --hard "$GITHUB_SHA"
          python3 scripts/publish_pending_releases.py --commit "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
