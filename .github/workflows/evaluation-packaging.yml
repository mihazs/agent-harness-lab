name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-loop-tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,lint]"
      - name: Run changed loop tests
        run: >-
          python -m pytest -x -q
          tests/integration/loop/test_resume_stored_run.py
          tests/integration/loop/test_cold_resume_cli.py
          tests/integration/loop/test_controller_ledger.py
          tests/integration/loop/test_frozen_bank_evaluator.py
          tests/integration/loop/test_incremental_runs.py
          tests/integration/loop/test_order_against_stub_runtime.py
          tests/integration/loop/test_resume.py
          tests/unit/docs/test_loop_reference.py
          tests/unit/loop/test_ledger_replay.py
          tests/unit/loop/test_receipt.py
          tests/unit/loop/test_scoring_manifest.py
          tests/integration/docs/test_improve_until_score_howto.py
          tests/integration/workflow/test_workflow.py
          tests/unit/workflow/test_entry_parity_durations.py
