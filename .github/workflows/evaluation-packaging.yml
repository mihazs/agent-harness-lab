name: Evaluation packaging
on: workflow_dispatch
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: arduino/setup-task@v3
        with:
          version: '3.54.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: task setup:test
      - name: Baseline lacks relationship reader
        run: '! git cat-file -e fb61e84c585b59c945fc423e5d330603cb50213b:agent_harness_lab/sources/generic_memory_links.py'
      - name: Focused synthetic checks
        run: python -m pytest -q tests/unit/sources/test_generic_memory.py tests/unit/sources/test_generic_memory_links.py
      - name: Lint and docs
        run: |
          task lint
          task docs:check
