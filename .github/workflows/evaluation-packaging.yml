name: Evaluation packaging
on: workflow_dispatch
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: arduino/setup-task@v3
        with:
          version: '3.54.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          cache: npm
      - run: task setup
      - run: task setup:test
      - run: task duplication:report
      - name: Baseline lacks Graphiti entity reader
        run: '! git cat-file -e 4920ece6629a9d8caa6998c9181834c7f5f97be8:agent_harness_lab/sources/graphiti_entities.py'
      - name: Focused synthetic checks
        run: python -m pytest -q tests/unit/sources/test_graphiti_episodes.py tests/unit/sources/test_graphiti_edges.py tests/unit/sources/test_graphiti_entities.py
      - name: Lint and docs
        run: |
          task lint
          task docs:check
