name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison-filters:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,lint]"
      - run: AHL_UPDATE_GOLDEN=1 python -m pytest -q tests/unit/evaluation/test_compare_viewer.py
      - run: python -m ruff check agent_harness_lab/evaluation/compare.py tests/unit/evaluation/test_compare_viewer.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-comparison-golden
          path: tests/support/golden_profiles/ahl-compare-viewer-v1.html
