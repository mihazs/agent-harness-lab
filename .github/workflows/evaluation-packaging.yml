name: Evaluation packaging
on: workflow_dispatch
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          version: '3.54.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          cache: npm
      - run: task setup
      - run: task setup:test
      - name: Start a user manager on the hosted runner
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Collect canaries in a real bounded user scope
        run: |
          systemctl --user show-environment >/dev/null
          systemd-run --user --scope --collect --quiet --expand-environment=no --property=Delegate=cpu\ memory\ pids --property=TasksMax=64 --property=MemoryMax=512M --property=RuntimeMaxSec=90 -- python -m pytest -c pyproject.toml tests/integration/sandbox/test_sandbox_kernel.py --collect-only -q > /tmp/kernel-collection.txt
          python -c "from pathlib import Path; from scripts.run_kernel_scopes import selections; assert selections(Path('/tmp/kernel-collection.txt').read_text(), Path('tests/integration/sandbox/test_sandbox_kernel.py'))"
