name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observations:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,lint]"
      - name: Baseline capability check
        run: '! git cat-file -e 5048568a0eb0d9f7e4bbca55fcb248284cf3feb3:agent_harness_lab/sources/langfuse.py'
      - run: python -m pytest -q tests/unit/sources/test_langfuse_observations.py tests/unit/sources/test_source_graph.py tests/unit/sources/test_source_execution.py
      - run: ruff check agent_harness_lab/sources/langfuse.py agent_harness_lab/sources/graph.py tests/unit/sources/test_langfuse_observations.py
      - run: python scripts/check_docs.py
