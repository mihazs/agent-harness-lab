name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,lint]"
      - name: Check lock safety and entry parity
        run: >-
          python -m pytest -x -q
          tests/integration/improve/test_stress_matrix.py::test_a_lock_left_by_a_dead_run_ends_busy_with_the_removal_step
          tests/integration/loop/test_cold_resume_cli.py::test_legacy_stale_project_lock_is_preserved
          tests/integration/loop/test_cold_resume_cli.py::test_project_lock_refuses_symlinks_without_touching_their_target
          tests/integration/loop/test_cold_resume_cli.py::test_project_lock_recovers_only_a_verified_previous_boot
          tests/integration/loop/test_improve_loop_cli.py::test_the_receipt_is_the_same_through_both_entries_apart_from_the_run_directory_and_the_clock
          tests/unit/workflow/test_entry_parity_durations.py
          tests/unit/workflow/test_exit_guidance.py
