name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test]"
      - run: python scripts/check_docs.py
      - run: python -m pytest -q tests/integration/docs/test_docs.py tests/unit/sources/test_source_knowledge_links.py
      - run: ahl --help
