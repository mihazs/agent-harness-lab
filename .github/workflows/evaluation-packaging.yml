name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assertion-summary:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,lint]"
      - name: Check frozen baseline against new cases
        run: |
          cp agent_harness_lab/evaluation/benchmark.py /tmp/candidate-benchmark.py
          git show 5048568a0eb0d9f7e4bbca55fcb248284cf3feb3:agent_harness_lab/evaluation/benchmark.py > agent_harness_lab/evaluation/benchmark.py
          set +e
          python -m pytest -q tests/unit/evaluation/test_benchmark_contracts.py::test_trajectory_summary_preserves_only_a_typed_required_claim tests/unit/evaluation/test_benchmark_contracts.py::test_trajectory_required_flag_refuses_non_boolean_claims > /tmp/baseline-assertions.log 2>&1
          status=$?
          set -e
          cat /tmp/baseline-assertions.log
          test "$status" -eq 1
          grep -q KeyError /tmp/baseline-assertions.log
          grep -q 'DID NOT RAISE' /tmp/baseline-assertions.log
          cp /tmp/candidate-benchmark.py agent_harness_lab/evaluation/benchmark.py
      - run: python -m pytest -q tests/unit/evaluation/test_benchmark_contracts.py
      - run: python -m ruff check agent_harness_lab/evaluation/benchmark.py tests/unit/evaluation/test_benchmark_contracts.py
      - run: python -m pytest -q tests/unit/evaluation/test_side_by_side_report.py tests/unit/evaluation/test_compare_viewer.py
      - run: python -m ruff check agent_harness_lab/evaluation/side_by_side.py tests/unit/evaluation/test_side_by_side_report.py
