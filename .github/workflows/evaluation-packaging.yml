name: Evaluation packaging
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: evaluation-packaging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          cache: npm
      - run: npm ci
      - run: npm run hooks:install
      - name: Require zero source clones
        run: npm run duplication:report
      - name: Verify staged pre-commit enforcement
        run: python -m unittest tools.tests.test_duplicate_hook -v
      - name: Build tools only; no inference dependencies or credentials
        run: python -m pip install setuptools==84.1.0 wheel==0.48.0
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist/wheels
      - run: python scripts/build_release.py --output dist/release
      - name: Clean wheel install and offline CLI smoke
        run: |
          python -m venv /tmp/ahl-wheel-smoke
          /tmp/ahl-wheel-smoke/bin/pip install --no-index --no-deps dist/wheels/*.whl
          cd /tmp
          /tmp/ahl-wheel-smoke/bin/ahl --help
          /tmp/ahl-wheel-smoke/bin/ahl research-simulate --tasks 10 --scenario delayed
          set +e
          /tmp/ahl-wheel-smoke/bin/ahl bank --starter --audit --cooperative-controls
          bank_status=$?
          set -e
          test "$bank_status" -eq 3
      - name: Check versioned archive imports without a model account
        run: |
          mkdir /tmp/ahl-archive-smoke
          tar -xzf dist/release/agent-harness-lab-*.tar.gz -C /tmp/ahl-archive-smoke
          cd /tmp/ahl-archive-smoke/agent-harness-lab-*
          python -m agent_harness_lab --help
          python -m agent_harness_lab research-simulate --tasks 10
          set +e
          python -m agent_harness_lab bank --starter --audit --cooperative-controls
          bank_status=$?
          set -e
          test "$bank_status" -eq 3
