name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: arduino/setup-task@v3
        with:
          version: '3.54.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: task setup:test
      - run: task lint
      - name: CLI help smoke checks
        run: |
          ahl --help
          ahl improve --help
      - name: Run both source test suites
        env:
          PYTEST_ADDOPTS: --maxfail=1
        run: task test TEST_WORKERS=2
