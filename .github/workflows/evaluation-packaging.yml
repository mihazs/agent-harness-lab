name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,lint]"
      - run: python -m ruff check .
      - run: ahl --help > /dev/null && ahl improve --help > /dev/null && ahl hypothesis-probe --help > /dev/null
      - run: python -m pytest -q -n 2 --dist worksteal
