name: Evaluation packaging
on: workflow_dispatch
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          version: '3.54.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          cache: npm
      - run: task setup
      - run: task setup:test
      - run: python -m pytest -q tests/unit/tools/test_kernel_scopes.py
      - run: task lint
      - run: task docs:check
