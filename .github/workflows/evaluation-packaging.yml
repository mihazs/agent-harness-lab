name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test]"
      - run: python scripts/check_docs.py
      - run: python -m pytest -q tests/integration/workflow/test_skill_loop_routing.py
      - name: Run documented two-area example
        shell: bash
        run: |
          export AHL_EXAMPLE_DIR="$(mktemp -d)"
          python -c "import os; from tests.support import score_fixture as f; p=f.project(os.environ['AHL_EXAMPLE_DIR']); s=f.experiment(p); f.write(p,s,f.records(s))"
          ahl score "$AHL_EXAMPLE_DIR" --spec "$AHL_EXAMPLE_DIR/experiment.json" --records "$AHL_EXAMPLE_DIR/trials.json" --format md > "$AHL_EXAMPLE_DIR/report.md"
          ahl score "$AHL_EXAMPLE_DIR" --spec "$AHL_EXAMPLE_DIR/experiment.json" --records "$AHL_EXAMPLE_DIR/trials.json" --area ux-ui > "$AHL_EXAMPLE_DIR/selected.json"
          python -c "import json,os,pathlib; p=pathlib.Path(os.environ['AHL_EXAMPLE_DIR']); s=(p/'report.md').read_text(); r=json.loads((p/'selected.json').read_text()); assert 'coding' in s.lower() and 'ux/ui' in s.lower(); assert [a['id'] for a in r['areas']]==['ux-ui']"
