name: Evaluation packaging
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-packaging:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          version: '3.54.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          cache: npm
      - run: task setup
      - run: task setup:test
      - name: Require zero source clones
        run: task duplication:report
      - name: Build tools only; no inference dependencies or credentials
        run: task setup:build
      - run: task build
      - name: Verify optional OKF parsing without model dependencies
        run: task setup:okf
      - name: Prepare clean wheel install and optional parser
        run: |
          task install:wheel
          task setup:okf PYTHON=dist/wheel-env/bin/python
          task setup:test:installed PYTHON=dist/wheel-env/bin/python
      - name: Check wheel and versioned archive layouts without a model account
        env:
          PYTEST_ADDOPTS: --maxfail=1
        run: task test:packaging:layouts
