name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe-inputs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,lint]"
      - run: python -m pytest -q tests/unit/evaluation/test_hypothesis_probe.py tests/integration/evaluation/test_hypothesis_probe_run.py
      - run: ahl hypothesis-probe --help
      - run: python -m ruff check agent_harness_lab/evaluation/hypothesis_probe.py agent_harness_lab/evaluation/probe_cli.py tests/unit/evaluation/test_hypothesis_probe.py tests/integration/evaluation/test_hypothesis_probe_run.py
