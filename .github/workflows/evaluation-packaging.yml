name: Evaluation packaging
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evaluation-packaging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          version: '3.54.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          cache: npm
      - run: task setup
      - name: Require zero source clones
        run: task duplication:report
      - name: Verify staged pre-commit enforcement
        run: task test:hooks
      - name: Build tools only; no inference dependencies or credentials
        run: task setup:build
      - run: task build
      - name: Verify optional OKF parsing without model dependencies
        run: task setup:okf
      - name: Clean wheel install and offline CLI smoke
        run: |
          task install:wheel
          task setup:okf PYTHON=dist/wheel-env/bin/python
          task test:wheel
      - name: Check versioned archive imports without a model account
        run: task test:archive
