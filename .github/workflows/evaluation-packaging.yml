name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interaction:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,lint]"
      - name: Baseline falsification
        shell: bash
        run: |
          git show 5048568a0eb0d9f7e4bbca55fcb248284cf3feb3:agent_harness_lab/evaluation/interaction_contract.py > agent_harness_lab/evaluation/interaction_contract.py
          set +e
          python -m pytest -q tests/unit/evaluation/test_interaction_contract.py::test_empty_permitted_reads_forbids_an_observed_read > /tmp/baseline-result.txt 2>&1
          result=$?
          set -e
          cat /tmp/baseline-result.txt
          test "$result" -eq 1
          grep -q AssertionError /tmp/baseline-result.txt
          git checkout -- agent_harness_lab/evaluation/interaction_contract.py
      - name: Candidate checks
        run: python -m pytest -q tests/unit/evaluation/test_interaction_contract.py tests/unit/evaluation/test_interaction_report.py tests/unit/evaluation/test_task_bank_interaction.py tests/unit/evaluation/test_interaction_control_families.py
      - run: ruff check agent_harness_lab/evaluation/interaction_contract.py tests/unit/evaluation/test_interaction_contract.py tests/unit/evaluation/test_interaction_report.py
      - run: python scripts/check_docs.py
