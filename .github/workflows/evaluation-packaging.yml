name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,lint]"
      - run: python -m pytest -x -q tests/unit/loop/test_carryover.py tests/unit/loop/test_receipt.py tests/integration/loop/test_incremental_runs.py tests/integration/loop/test_cold_resume_cli.py
      - run: ruff check agent_harness_lab/loop/carryover.py agent_harness_lab/loop/improve.py agent_harness_lab/loop/receipt.py tests/unit/loop/test_carryover.py
