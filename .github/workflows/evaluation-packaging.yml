name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/ahl-playwright-browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,lint]" playwright
      - run: python -m playwright install chromium
      - run: AHL_UPDATE_GOLDEN=1 python -m pytest -q tests/unit/evaluation/test_compare_viewer.py tests/unit/evaluation/test_compare_viewer_audit.py tests/unit/evaluation/test_compare_precision.py tests/unit/evaluation/test_compare_preservation.py tests/unit/evaluation/test_compare_public.py
      - run: AHL_COMPARE_BROWSER=1 python -m pytest -q tests/integration/evaluation/test_compare_filters_browser.py
      - run: python -m ruff check agent_harness_lab/evaluation/compare.py tests/unit/evaluation/test_compare_viewer.py tests/integration/evaluation/test_compare_filters_browser.py
      - run: python -m pytest -q tests/unit/evaluation/test_benchmark_contracts.py tests/unit/evaluation/test_side_by_side_report.py
      - run: python -m ruff check agent_harness_lab/evaluation/benchmark.py agent_harness_lab/evaluation/side_by_side.py tests/unit/evaluation/test_benchmark_contracts.py tests/unit/evaluation/test_side_by_side_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-comparison-golden
          path: tests/support/golden_profiles/ahl-compare-viewer-v1.html
