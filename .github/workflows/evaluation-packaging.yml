name: Evaluation packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test,lint]"
      - run: |
          python - <<'PYCODE'
          import json, statistics, sys
          from tools.perf_bench import run
          commands = [[sys.executable, '-c', 'pass'], [sys.executable, '-m', 'agent_harness_lab', 'hypothesis-probe', '--help']]
          medians = []
          for command in commands:
              run(command)
              samples = [run(command) for _ in range(9)]
              assert all(status == 0 for _, _, status in samples)
              medians.append(statistics.median(elapsed for elapsed, _, _ in samples))
          budget = json.load(open('tools/perf_budgets.json'))['startup_ratio_max']['hypothesis-probe']
          ratio = medians[1] / medians[0]
          print('startup ratio:', round(ratio, 2), 'budget:', budget)
          assert ratio <= budget
          PYCODE
