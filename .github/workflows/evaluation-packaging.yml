name: Evaluation packaging
on: workflow_dispatch
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          version: '3.54.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          cache: npm
      - run: task setup
      - run: task setup:test
      - name: Start a user manager on the hosted runner
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Run bounded kernel canaries
        run: task test:sandbox:kernel
