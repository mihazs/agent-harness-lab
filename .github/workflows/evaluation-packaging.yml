name: Evaluation packaging
on: workflow_dispatch
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: arduino/setup-task@v3
        with:
          version: '3.54.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: task setup:test
      - run: python -m pip install 'langgraph-checkpoint==4.3.2'
      - name: Baseline lacks Graphiti reader
        run: '! git cat-file -e 5048568a0eb0d9f7e4bbca55fcb248284cf3feb3:agent_harness_lab/sources/graphiti_episodes.py'
      - name: Focused synthetic checks
        run: python -m pytest -q tests/unit/sources/test_graphiti_episodes.py tests/unit/sources/test_langgraph_items.py tests/unit/sources/test_langgraph_upstream_optional.py tests/unit/docs/test_memory_compatibility_matrix.py
      - name: Lint and docs
        run: |
          task lint
          task docs:check
