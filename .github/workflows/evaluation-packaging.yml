name: Evaluation packaging
on: workflow_dispatch
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: arduino/setup-task@v3
        with:
          version: '3.54.0'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: task setup:test
      - name: Focused synthetic checks
        run: for iteration in {1..10}; do python -m pytest -q tests/integration/evaluation/test_certification_access.py::TestCertificationAccess::test_concurrent_managed_runs_have_one_actual_dispatch || exit 1; done
      - name: Lint
        run: task lint
