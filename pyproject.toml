[project]
name = "agent-harness-lab"
version = "0.141.0"
description = "Evidence-based agent harness diagnosis, process mining, and paired evaluation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-xdist==3.8.0"]
lint = ["ruff==0.17.2"]
okf = ["PyYAML==6.0.3"]
ml = ["scikit-learn>=1.3", "sentence-transformers>=3", "transformers>=4.40", "torch>=2", "sentencepiece>=0.2"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills/harness-evaluation/scripts"]
python_files = ["test_*.py"]
# append keeps an installed wheel or archive ahead of the checkout on sys.path; tests/ is a package, so the
# default prepend would put the repository root first and shadow the installed agent_harness_lab.
addopts = "--strict-config --strict-markers --import-mode=append"

[tool.ruff]
target-version = "py311"
# Frozen fixtures and grader bundles are held-out inputs and must never be rewritten.
extend-exclude = ["agent_harness_lab/evaluation/fixtures", "fixtures", "dist", "artifacts", "node_modules"]

[tool.ruff.lint]
# Pyflakes and syntax errors: unused or undefined names, redefinitions and invalid code. Formatting rules
# are deliberately not selected; the compact house style is not reformatted.
select = ["F", "E9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_harness_lab*", "tools"]
namespaces = false

[tool.setuptools.package-data]
"agent_harness_lab.evaluation" = ["fixtures/**/*.json", "fixtures/**/*.py", "fixtures/**/*.txt"]

[project.scripts]
ahl = "agent_harness_lab.cli:main"

[tool.setuptools.data-files]
"share/agent-harness-lab/skills/harness-evaluation" = ["skills/harness-evaluation/SKILL.md"]
"share/agent-harness-lab/skills/harness-evaluation/scripts" = ["skills/harness-evaluation/scripts/run_evaluation.py", "skills/harness-evaluation/scripts/mine_traces.py"]
"share/agent-harness-lab/skills/harness-evaluation/references" = ["skills/harness-evaluation/references/execution.md", "skills/harness-evaluation/references/trace-diagnosis.md", "skills/harness-evaluation/references/evidence-to-design.md", "skills/harness-evaluation/references/isolation.md"]
"share/agent-harness-lab/skills/harness-self-improvement" = ["skills/harness-self-improvement/SKILL.md"]
"share/agent-harness-lab/skills/harness-self-improvement/agents" = ["skills/harness-self-improvement/agents/openai.yaml"]
"share/agent-harness-lab/skills/harness-self-improvement/references" = ["skills/harness-self-improvement/references/invocation.md", "skills/harness-self-improvement/references/surfaces.md"]
