version: '3'
vars:
  PYTHON: '{{default "python3" .PYTHON}}'
tasks:
  test:execution:presentation:
    desc: Verify actual workflow presentation and configured Codex/Claude entrypoints
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - task: test:workflow:repeated
        vars:
          PYTHON: '{{.PYTHON}}'
          LAYOUT_DIR: '{{.LAYOUT_DIR}}'
          EXPECTED_PACKAGE_ROOT: '{{.EXPECTED_PACKAGE_ROOT}}'
          REPEATED_TEST_PATTERN: test_execution_presentation.py
      - task: test:workflow:repeated
        vars:
          PYTHON: '{{.PYTHON}}'
          LAYOUT_DIR: '{{.LAYOUT_DIR}}'
          EXPECTED_PACKAGE_ROOT: '{{.EXPECTED_PACKAGE_ROOT}}'
          REPEATED_TEST_PATTERN: test_execution_runtime_entry.py
  test:skill-invocation:
    desc: Execute installed skill entry routing and managed-child denial contracts
    dir: '{{default .ROOT_DIR .LAYOUT_DIR}}'
    env:
      PYTHONPATH: ''
      AHL_EXPECTED_PACKAGE_ROOT: '{{default .ROOT_DIR .EXPECTED_PACKAGE_ROOT}}'
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_skill_invocation.py" -v'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_skill_invocation_native.py" -v'
  test:skill-invocation:kernel:
    desc: Run one unchanged conditional final experiment through the skill adapter
    dir: '{{default .ROOT_DIR .LAYOUT_DIR}}'
    vars:
      SCOPE_ID:
        sh: cat /proc/sys/kernel/random/uuid
    env:
      PYTHONPATH: ''
      AHL_TEST_SYSTEMD_SCOPE: '1'
      AHL_EXPECTED_PACKAGE_ROOT: '{{default .ROOT_DIR .EXPECTED_PACKAGE_ROOT}}'
    cmds:
      - 'systemd-run --user --scope --collect --quiet --expand-environment=no --unit=ahl-sandbox-test-{{.SCOPE_ID}} --property="Delegate=cpu memory pids" --property=TasksMax=64 --property=MemoryMax=512M --property=RuntimeMaxSec=300 -- {{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_skill_invocation_native.py" -k test_installed_alias_applies_and_public_rollback_restores -v'
  test:skill-invocation:compatibility:
    desc: Check existing workflow, execution selection and skill installer callers
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_workflow.py" -v'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_config_execution.py" -v'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_link_skills.py" -v'
  test:configuration:delegation-packet:
    desc: Verify unsigned configured packet preparation without inference or signing
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - task: test:workflow:repeated
        vars:
          PYTHON: '{{.PYTHON}}'
          LAYOUT_DIR: '{{.LAYOUT_DIR}}'
          EXPECTED_PACKAGE_ROOT: '{{.EXPECTED_PACKAGE_ROOT}}'
          REPEATED_TEST_PATTERN: test_configured_delegation_packet.py
  test:application:conditional:
    desc: Verify bounded application selection and explicit authority requirements
    cmds:
      - task: test:workflow:repeated
        vars:
          PYTHON: '{{.PYTHON}}'
          LAYOUT_DIR: '{{.LAYOUT_DIR}}'
          EXPECTED_PACKAGE_ROOT: '{{.EXPECTED_PACKAGE_ROOT}}'
          REPEATED_TEST_PATTERN: test_conditional_application.py
      - task: test:workflow:repeated
        vars:
          PYTHON: '{{.PYTHON}}'
          LAYOUT_DIR: '{{.LAYOUT_DIR}}'
          EXPECTED_PACKAGE_ROOT: '{{.EXPECTED_PACKAGE_ROOT}}'
          REPEATED_TEST_PATTERN: test_conditional_application_authority.py
      - task: test:workflow:repeated
        vars:
          PYTHON: '{{.PYTHON}}'
          LAYOUT_DIR: '{{.LAYOUT_DIR}}'
          EXPECTED_PACKAGE_ROOT: '{{.EXPECTED_PACKAGE_ROOT}}'
          REPEATED_TEST_PATTERN: test_conditional_commit_observation.py
  test:application:conditional:kernel:
    desc: Exercise explicitly authorized final evaluation and guarded root instruction application
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    cmds:
      - task: test:evaluation:bank-requalification:kernel
        vars:
          PYTHON: '{{.PYTHON}}'
          LAYOUT_DIR: '{{.LAYOUT_DIR}}'
          EXPECTED_PACKAGE_ROOT: '{{.EXPECTED_PACKAGE_ROOT}}'
          TEST_NAME: conditional_application_native
          KERNEL_TEST_FILTER: '{{default "ConditionalApplication" .KERNEL_TEST_FILTER}}'
  test:evaluation:construction-seals:
    desc: Run closed construction custody cases
    dir: '{{default .ROOT_DIR .LAYOUT_DIR}}'
    env:
      PYTHONPATH: ''
      AHL_EXPECTED_PACKAGE_ROOT: '{{default "" .EXPECTED_PACKAGE_ROOT}}'
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_construction_seals.py" -v'
  test:evaluation:bank-requalification:
    desc: Run conditional bank requalification and closed input cases
    dir: '{{default .ROOT_DIR .LAYOUT_DIR}}'
    env:
      PYTHONPATH: ''
      AHL_EXPECTED_PACKAGE_ROOT: '{{default "" .EXPECTED_PACKAGE_ROOT}}'
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_bank_requalification*.py" -v'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_closed_project_inputs.py" -v'
  test:evaluation:bank-requalification:kernel:
    desc: Run native closed input and conditional bank requalification cases
    dir: '{{default .ROOT_DIR .LAYOUT_DIR}}'
    vars:
      SCOPE_ID:
        sh: 'date +%s%N'
    env:
      AHL_TEST_SYSTEMD_SCOPE: '1'
      PYTHONPATH: ''
      AHL_EXPECTED_PACKAGE_ROOT: '{{default .ROOT_DIR .EXPECTED_PACKAGE_ROOT}}'
    cmds:
      - 'systemd-run --user --scope --collect --quiet --expand-environment=no --unit=ahl-sandbox-test-{{.SCOPE_ID}} --property="Delegate=cpu memory pids" --property=TasksMax=64 --property=MemoryMax=512M --property=RuntimeMaxSec=300 -- {{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_{{default "bank_requalification" .TEST_NAME}}.py" -k {{default "" .KERNEL_TEST_FILTER | shellQuote}} -v'
  test:evaluation:legacy-focus:
