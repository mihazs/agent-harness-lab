  experiment:oracle:
    desc: Compute the verified oracle pin for an exported repeated-experiment manifest
    requires:
      vars: [MANIFEST]
    cmds:
      - >-
        {{.PYTHON | shellQuote}} -c
        'from pathlib import Path; import sys; from agent_harness_lab.private_journal import record; from agent_harness_lab.evaluation.oracle import identity; p=Path(sys.argv[1]); m,_=record(p,1024*1024); print(identity(p.parent,m["tasks"],m.get("grader_bundles",{})))'
        {{.MANIFEST | shellQuote}}
  input:digest:
    desc: Compute the bounded file-tree identity of an explicitly selected fixture or oracle
    requires:
      vars: [INPUT_DIR]
    cmds:
      - >-
        {{.PYTHON | shellQuote}} -c
        'import sys; from agent_harness_lab.evaluation.integrity import digest; print(digest(sys.argv[1]))'
        {{.INPUT_DIR | shellQuote}}
  experiment:trajectory-engine:
    desc: Print the exact current evaluator/dependency/Python identity for a frozen trajectory oracle
    cmds:
      - >-
        {{.PYTHON | shellQuote}} -c
        'import json; from agent_harness_lab.evaluation.trajectory_assertions import engine; print(json.dumps(engine(),sort_keys=True))'
