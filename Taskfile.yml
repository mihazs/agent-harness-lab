version: '3'
vars:
  PYTHON: '{{default "python3" .PYTHON}}'
tasks:
  test:
    desc: Run both native README test suites
    cmds:
      - task: test:tools
      - task: test:evaluator
  test:tools:
    desc: Run application and tooling unittest cases
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_*.py"'
  test:evaluator:
    desc: Run evaluator unittest cases
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s skills/harness-evaluation/scripts -p "test_*.py"'
  test:sources:
    desc: Run source contracts and checkpoint unittest cases
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_source_*.py"'
  test:sources:grouping:
    desc: Run native lexical grouping, revision and bank-exposure controls
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_source_grouping.py" -v'
  test:sources:graph:
    desc: Run native graph contracts, migrations and scoped source relationship cases
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_source_graph.py" -v'
  test:sources:recheck:
    desc: Run configured GitHub and local Git native relationship recheck cases
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_source_recheck.py" -v'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_source_git.py" -k recheck -v'
  test:sources:context:
    desc: Run private journal inventory and offline analyze/doctor context cases
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_source_context.py" -v'
  test:sources:codex:
    desc: Run native Codex source receipts, checkpoint admission and immutable history cases
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_source_codex*.py" -v'
  test:sources:claude:
    desc: Run native Claude source revisions, identity claims, graph and checkpoint cases
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_source_claude.py" -v'
  test:sources:native:compat:
    desc: Compare Codex file/root preview hashes with an explicitly frozen baseline
    requires:
      vars: [BASELINE]
    env:
      AHL_NATIVE_BASELINE_ROOT: '{{.BASELINE}}'
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_source_native_compat.py" -v'
  test:sources:git:
    desc: Run synthetic native Git snapshots, graph, coverage and compatibility cases
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_source_git.py" -v'
  test:captures:codex:
    desc: Run pinned Codex rollout projection, scope, privacy and CLI cases
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_codex_rollout.py" -v'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_codex_discovery.py" -v'
  test:captures:claude:
    desc: Run pinned Claude native scope, privacy, response consistency and resource controls
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_claude_native.py" -v'
  test:sources:github:live:
    desc: Run explicitly selected public GitHub acceptance without credentials or captured fixtures
    requires:
      vars: [GITHUB_ENDPOINT, GITHUB_REPO_ID, GITHUB_ISSUE, GITHUB_PULL]
    env:
      AHL_TEST_GITHUB_LIVE: '1'
      AHL_TEST_GITHUB_ENDPOINT: '{{.GITHUB_ENDPOINT}}'
      AHL_TEST_GITHUB_REPO_ID: '{{.GITHUB_REPO_ID}}'
      AHL_TEST_GITHUB_ISSUE: '{{.GITHUB_ISSUE}}'
      AHL_TEST_GITHUB_PULL: '{{.GITHUB_PULL}}'
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_source_github_live.py" -v'
  test:sources:github:commit:live:
    desc: Run one explicitly selected public GitHub commit acceptance without credentials
    requires:
      vars: [GITHUB_ENDPOINT, GITHUB_REPO_ID, GITHUB_COMMIT]
    env:
      AHL_TEST_GITHUB_LIVE: '1'
      AHL_TEST_GITHUB_ENDPOINT: '{{.GITHUB_ENDPOINT}}'
      AHL_TEST_GITHUB_REPO_ID: '{{.GITHUB_REPO_ID}}'
      AHL_TEST_GITHUB_COMMIT: '{{.GITHUB_COMMIT}}'
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest tools.tests.test_source_github_live.GitHubLiveTests.test_explicit_public_commit_contract -v'
  test:sources:github:recheck:live:
    desc: Run one explicit anonymous public PR import and read-only relationship recheck
    requires:
      vars: [GITHUB_ENDPOINT, GITHUB_REPO_ID, GITHUB_PULL]
    env:
      AHL_TEST_GITHUB_LIVE: '1'
      AHL_TEST_GITHUB_RECHECK: '1'
      AHL_TEST_GITHUB_ENDPOINT: '{{.GITHUB_ENDPOINT}}'
      AHL_TEST_GITHUB_REPO_ID: '{{.GITHUB_REPO_ID}}'
      AHL_TEST_GITHUB_PULL: '{{.GITHUB_PULL}}'
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest tools.tests.test_source_github_live.GitHubLiveTests.test_explicit_cli_native_relationship_recheck -v'
  test:hooks:
    desc: Run native Lefthook and staged-index integration tests
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest tools.tests.test_duplicate_hook -v'
  test:sandbox:
    desc: Run native resource boundary and explicit delegated-host tests
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_sandbox_*.py" -v'
  test:sandbox:graders:
    desc: Run frozen grader controls and cooperative workflow isolation contracts
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_sandbox_graders.py" -v'
  test:evaluation:deadline:
    desc: Run native preparation and inherited parent deadline controls
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_sandbox_deadline.py" -v'
  test:evaluation:inference:
    desc: Run synthetic controller inference, state and paired executor contracts
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_sandbox_inference.py" -v'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_sandbox_working_state.py" -v'
  test:evaluation:roles:
    desc: Run controlled preparation views, authored contracts and workflow cases
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_sandbox_construction.py" -v'
  test:evaluation:regressions:
    desc: Run native regression reproduction contract tests
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_regression_*.py" -v'
  test:evaluation:review:
    desc: Run native private review-store lifecycle and evidence-integrity cases
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s tools/tests -p "test_regression_review.py" -v'
  test:sandbox:kernel:state:
    desc: Run the new working-state canary in a disposable delegated scope
    cmds:
      - task: test:sandbox:kernel
        vars:
          KERNEL_TEST_FILTER: working_state
  test:sandbox:kernel:roles:
    desc: Run full controlled workflow and hostile role reads in a delegated scope
    cmds:
      - task: test:sandbox:kernel
        vars:
          KERNEL_TEST_FILTER: controlled_workflow
  test:sandbox:kernel:regressions:
    desc: Audit frozen draft grader controls with actual pinned workers and quotas
    cmds:
      - task: test:sandbox:kernel
        vars:
          KERNEL_TEST_FILTER: regression_
  test:sandbox:kernel:
    desc: Run native kernel canaries in a disposable foreground user scope (Linux/systemd)
    dir: '{{default .ROOT_DIR .LAYOUT_DIR}}'
    vars:
      SCOPE_ID:
        sh: cat /proc/sys/kernel/random/uuid
    env:
      PYTHONPATH: ''
      AHL_TEST_SYSTEMD_SCOPE: '1'
      AHL_TEST_CGROUP_ROOT: ''
      AHL_EXPECTED_PACKAGE_ROOT: '{{default .ROOT_DIR .EXPECTED_PACKAGE_ROOT}}'
    cmds:
      - 'systemd-run --user --scope --collect --quiet --expand-environment=no --unit=ahl-sandbox-test-{{.SCOPE_ID}} --property="Delegate=cpu memory pids" --property=TasksMax=64 --property=MemoryMax=512M --property=RuntimeMaxSec=90 -- {{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_sandbox_kernel.py" -k {{default "" .KERNEL_TEST_FILTER | shellQuote}} -v'
  bank:build:
    desc: Reproduce the bundled public synthetic bank and frozen grader digests
    cmds:
      - '{{.PYTHON | shellQuote}} scripts/build_synthetic_bank.py'
  runtime:pin:
    desc: Inspect an explicitly supplied extracted rootfs without executing image code
    requires:
      vars: [ROOTFS]
    cmds:
      - '{{.PYTHON | shellQuote}} -m agent_harness_lab.evaluation.image {{.ROOTFS | shellQuote}}'
  test:installed:
    desc: Run native tests against an installed wheel or extracted archive
    dir: '{{.LAYOUT_DIR}}'
    requires:
      vars: [LAYOUT_DIR, EXPECTED_PACKAGE_ROOT]
    env:
      PYTHONPATH: ''
      AHL_EXPECTED_PACKAGE_ROOT: '{{.EXPECTED_PACKAGE_ROOT}}'
    cmds:
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_installed_layout.py"'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_source_*.py"'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_codex_rollout.py"'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_codex_discovery.py"'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_claude_native.py"'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_sandbox_*.py"'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_offline_evaluation.py"'
      - '{{.PYTHON | shellQuote}} -m unittest discover -s {{.ROOT_DIR | shellQuote}}/tools/tests -p "test_regression_*.py"'
  install:wheel:
    cmds:
      - '{{.PYTHON | shellQuote}} -m venv dist/wheel-env'
      - dist/wheel-env/bin/python -m pip install --no-index --no-deps --force-reinstall dist/wheels/*.whl
      - mkdir -p dist/wheel-cwd
  test:wheel:
    cmds:
      - task: test:installed
        vars:
          PYTHON: '{{.ROOT_DIR}}/dist/wheel-env/bin/python'
          LAYOUT_DIR: '{{.ROOT_DIR}}/dist/wheel-cwd'
          EXPECTED_PACKAGE_ROOT: '{{.ROOT_DIR}}/dist/wheel-env'
  test:archive:
    vars:
      PACKAGE_VERSION:
        sh: '{{.PYTHON | shellQuote}} -m agent_harness_lab --version'
    cmds:
      - mkdir -p dist/archive
      - 'tar -xzf {{printf "dist/release/agent-harness-lab-%s.tar.gz" .PACKAGE_VERSION | shellQuote}} -C dist/archive'
      - task: test:installed
        vars:
          LAYOUT_DIR: '{{.ROOT_DIR}}/dist/archive/agent-harness-lab-{{.PACKAGE_VERSION}}'
          EXPECTED_PACKAGE_ROOT: '{{.ROOT_DIR}}/dist/archive/agent-harness-lab-{{.PACKAGE_VERSION}}'
  duplication:check:
    desc: Require zero clones in the Git index
    cmds:
      - '{{.PYTHON | shellQuote}} scripts/check_duplicates.py'
  duplication:report:
    desc: Require zero clones in working source
    cmds:
      - node_modules/.bin/jscpd --config .jscpd.json --no-colors
  setup:
    desc: Install development dependencies and guarded Git hooks
    cmds:
      - npm ci
      - task: hooks:install
  venv:
    desc: Create the local Python build environment
    cmds:
      - '{{.PYTHON | shellQuote}} -m venv .venv'
  setup:build:
    desc: Install the existing pinned wheel build tools
    cmds:
      - '{{.PYTHON | shellQuote}} -m pip install setuptools==84.1.0 wheel==0.48.0'
  setup:okf:
    desc: Install the optional YAML parser for OKF imports
    cmds:
      - '{{.PYTHON | shellQuote}} -m pip install PyYAML==6.0.3'
  hooks:install:
    desc: Install or migrate the owned Lefthook integration
    cmds:
      - '{{.PYTHON | shellQuote}} scripts/install_hooks.py'
  build:
    desc: Build the wheel and allowlisted release archive
    cmds:
      - task: build:wheel
      - task: build:archive
  build:wheel:
    cmds:
      - '{{.PYTHON | shellQuote}} -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist/wheels'
  build:archive:
    cmds:
      - '{{.PYTHON | shellQuote}} scripts/build_release.py --output dist/release'
  version:
    cmds:
      - npm run version-packages
  changeset:
    cmds:
      - npm run changeset
  release:
    cmds:
      - '{{.PYTHON | shellQuote}} scripts/publish_release.py'
  release:verify:
    desc: Download and verify the current public release using native acceptance tests
    requires:
      vars: [COMMIT]
    vars:
      PACKAGE_VERSION:
        sh: '{{.PYTHON | shellQuote}} -m agent_harness_lab --version'
    env:
      AHL_RELEASE_DIR: '{{.ROOT_DIR}}/dist/published/v{{.PACKAGE_VERSION}}'
      AHL_EXPECTED_COMMIT: '{{.COMMIT}}'
    cmds:
      - 'gh release download {{printf "v%s" .PACKAGE_VERSION | shellQuote}} --dir {{printf "dist/published/v%s" .PACKAGE_VERSION | shellQuote}} --clobber'
      - '{{.PYTHON | shellQuote}} -m unittest tools.tests.test_published_release -v'
